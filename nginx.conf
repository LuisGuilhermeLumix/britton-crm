server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Asset filenames carry a content hash, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html points at those hashed files — caching it would pin users to
    # an old build after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Serve the SPA shell for any unknown path, so a direct hit or refresh on
    # a route returns the app instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
